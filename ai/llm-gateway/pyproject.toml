[project]
name = "llm-gateway"
version = "0.1.0"
description = "LiteLLM-backed gateway — unified routing, cost tracking, prompt versioning"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm[mcp]>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "langfuse>=4.7,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "anyio[trio]>=4.6.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
