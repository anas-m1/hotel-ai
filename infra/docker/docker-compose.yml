services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_inventory   # default DB; init-db.sh creates additional ones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go microservices ──────────────────────────────────────────────────────
  hotel-inventory:
    build:
      context: ../../services/hotel-inventory
      dockerfile: Dockerfile
    env_file: ./hotel-inventory.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  booking-ops:
    build:
      context: ../../services/booking-ops
      dockerfile: Dockerfile
    env_file: ./booking-ops.env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Kafka in KRaft mode (no ZooKeeper)
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Kafka UI — browse topics and messages at http://localhost:9000
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    ports:
      - "9000:9000"
    depends_on:
      kafka:
        condition: service_healthy

  rag-pipeline:
    build:
      context: ../../ai/rag-pipeline
      dockerfile: Dockerfile
    env_file: ./rag-pipeline.env
    ports:
      - "8091:8091"
    depends_on:
      - qdrant
      - hotel-inventory

  llm-gateway:
    build:
      context: ../../ai/llm-gateway
      dockerfile: Dockerfile
    env_file: ./llm-gateway.env
    ports:
      - "8090:8090"
    volumes:
      # Cost log persisted on the host so you can inspect it without exec-ing the container
      - llm_usage:/tmp

  booking-assistant:
    build:
      context: ../../ai/booking-assistant
      dockerfile: Dockerfile
    env_file: ./booking-assistant.env
    ports:
      - "8092:8092"
    depends_on:
      - llm-gateway
      - hotel-inventory
      - booking-ops

  multi-agent:
    build:
      context: ../../ai/multi-agent
      dockerfile: Dockerfile
    env_file: ./multi-agent.env
    ports:
      - "8093:8093"
    volumes:
      # shared/events/ schemas available at /app/shared inside the container
      - ../../shared:/app/shared:ro
    depends_on:
      kafka:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      booking-ops:
        condition: service_started
      hotel-inventory:
        condition: service_started
      rag-pipeline:
        condition: service_started

  # ── One-off migration runners ─────────────────────────────────────────────
  # These are NOT started by default. Run them explicitly when deploying:
  #
  #   docker compose run --rm migrate-hotel-inventory
  #   docker compose run --rm migrate-booking-ops
  #
  # They exit immediately after applying migrations.
  # For rollback, override the command: docker compose run --rm migrate-hotel-inventory down
  migrate-hotel-inventory:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../../services/hotel-inventory/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://hotel:hotel@postgres:5432/hotel_inventory?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

  migrate-booking-ops:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../../services/booking-ops/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://hotel:hotel@postgres:5432/booking_ops?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

volumes:
  postgres_data:
  qdrant_data:
  llm_usage:
  kafka_data:
