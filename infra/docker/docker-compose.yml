# ── Infra ───────────────────────────────────────────────────────────────────
# Shared env for the Langfuse v4 stack (web + worker). Postgres keeps
# OLTP/entity data; traces/observations/scores live in Clickhouse; event
# bodies/media are archived in Minio; redis is the ingest queue/cache.
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://hotel:hotel@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: dev-secret-change-in-production
  SALT: dev-salt-change-in-production
  ENCRYPTION_KEY: cb4be7c5cd3020d7206cbed0a4ef55979cb78110ea5f799d532dfd3c32e7fdc8 # local development default; gitleaks:allow
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  # v2→v4 server jump: classic ingestion (litellm callback, <v4 SDKs) writes to
  # the old tables AND is replayed into the new events model by the worker
  # (dual-write bridge, ~15 min propagation). Native OTel/>=v4-SDK writes land
  # immediately. No old history to backfill (v2 tables were dropped), so the
  # historic backfill is left disabled.
  LANGFUSE_MIGRATION_V4_WRITE_MODE: "dual"
  LANGFUSE_BACKGROUND_MIGRATION_V4_ENABLE_HISTORIC_BACKFILL: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: 6379
  REDIS_AUTH: langfuse-dev-only
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:

  # Optional CPU-first model host. Weights are pulled explicitly, not on startup.
  ollama:
    profiles: ["local-model"]
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_inventory   # default DB; init-db.sh creates additional ones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go microservices ──────────────────────────────────────────────────────
  hotel-inventory:
    build:
      context: ../../services/hotel-inventory
      dockerfile: Dockerfile
    env_file: ./hotel-inventory.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  booking-ops:
    build:
      context: ../../services/booking-ops
      dockerfile: Dockerfile
    env_file: ./booking-ops.env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    # LangGraph Redis checkpointer uses Redis Search (FT.* commands).
    image: redis/redis-stack-server:7.4.0-v7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-stack-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Langfuse's cache/queue Redis is separate because LangGraph uses the
  # passwordless Redis Stack above for its checkpoint indexes.
  langfuse-redis:
    profiles: ["observability"]
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: langfuse-dev-only
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Langfuse v4 — self-hosted LLM observability stack ──────────────────────
  # UI at http://localhost:3000 (langfuse-web). Minio console at
  # http://localhost:9091 (creds minio/miniosecret). Events flow:
  #   SDK/API → langfuse-web → redis queue → langfuse-worker → clickhouse
  # Postgres keeps OLTP/entity data; traces/observations/scores live in
  # Clickhouse; event bodies/blob-media are archived in Minio (bucket "langfuse").
  # The OTEL ingest endpoint (/api/public/otel) is available on langfuse-web,
  # so SDK-level traces (LangChain/LangGraph v4 callbacks) also work.
  # Reuses the shared Postgres (db "langfuse") and its own password-protected
  # Redis; application checkpointer data remains in Redis Stack above.
  clickhouse:
    profiles: ["observability"]
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"   # HTTP (native is internal-only)
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: ["observability"]
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5

  langfuse-worker:
    profiles: ["observability"]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.36.0
    restart: unless-stopped
    environment: *langfuse-env
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy

  langfuse-web:
    profiles: ["observability"]
    image: langfuse/langfuse:4.36.0
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy

  rag-pipeline:
    build:
      context: ../../ai/rag-pipeline
      dockerfile: Dockerfile
    env_file: ./rag-pipeline.env
    ports:
      - "8091:8091"
    depends_on:
      - qdrant
      - hotel-inventory

  llm-gateway:
    build:
      context: ../../ai/llm-gateway
      dockerfile: Dockerfile
    env_file: ./llm-gateway.env
    ports:
      - "8090:8090"
    volumes:
      # Cost log persisted on the host so you can inspect it without exec-ing the container
      - llm_usage:/tmp

  booking-assistant:
    build:
      context: ../../ai/booking-assistant
      dockerfile: Dockerfile
    env_file: ./booking-assistant.env
    ports:
      - "8092:8092"
    depends_on:
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      hotel-inventory:
        condition: service_started
      booking-ops:
        condition: service_started
      rag-pipeline:
        condition: service_started

  # Optional Telegram polling adapter. Start explicitly after adding a fresh
  # token to the ignored telegram-bot.env file.
  hotel-ai-telegram-adapter:
    profiles: ["telegram"]
    build:
      context: ../../integrations/telegram-bot
      dockerfile: Dockerfile
    env_file: ./telegram-bot.env
    environment:
      BOOKING_ASSISTANT_URL: http://booking-assistant:8092
    restart: unless-stopped
    depends_on:
      - booking-assistant

  # ── Optional MCP adapters ─────────────────────────────────────────────────
  mcp-hotel-inventory:
    profiles: ["mcp"]
    build:
      context: ../../integrations/mcp/hotel-inventory
      dockerfile: Dockerfile
    env_file: ./mcp-hotel-inventory.env
    ports:
      - "8100:8100"
    depends_on:
      - hotel-inventory

  mcp-booking-ops:
    profiles: ["mcp"]
    build:
      context: ../../integrations/mcp/booking-ops
      dockerfile: Dockerfile
    env_file: ./mcp-booking-ops.env
    ports:
      - "8101:8101"
    depends_on:
      - booking-ops

  # ── One-off migration runners ─────────────────────────────────────────────
  # These are NOT started by default. Run them explicitly when deploying:
  #
  #   docker compose run --rm migrate-hotel-inventory
  #   docker compose run --rm migrate-booking-ops
  #
  # They exit immediately after applying migrations.
  # For rollback, override the command: docker compose run --rm migrate-hotel-inventory down
  migrate-hotel-inventory:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../../services/hotel-inventory/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://hotel:hotel@postgres:5432/hotel_inventory?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

  migrate-booking-ops:
    image: migrate/migrate:v4.17.1
    volumes:
      - ../../services/booking-ops/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://hotel:hotel@postgres:5432/booking_ops?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

volumes:
  ollama_data:
  langfuse_redis_data:
  postgres_data:
  qdrant_data:
  llm_usage:
  redis_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
