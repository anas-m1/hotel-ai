apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: hotel-ai
  labels:
    app: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      tolerations:
        - key: workload
          value: ai
          effect: NoSchedule
      nodeSelector:
        role: ai
      containers:
        - name: llm-gateway
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/hotel-ai-ENV/llm-gateway:IMAGE_TAG
          ports:
            - containerPort: 8090
          envFrom:
            - secretRef:
                name: llm-gateway-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: hotel-ai
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 8090
      targetPort: 8090
