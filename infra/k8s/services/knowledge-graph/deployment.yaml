apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph
  namespace: hotel-ai
  labels:
    app: knowledge-graph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-graph
  template:
    metadata:
      labels:
        app: knowledge-graph
    spec:
      tolerations:
        - key: workload
          value: ai
          effect: NoSchedule
      nodeSelector:
        role: ai
      containers:
        - name: knowledge-graph
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/hotel-ai-ENV/knowledge-graph:IMAGE_TAG
          ports:
            - containerPort: 8094
          envFrom:
            - secretRef:
                name: knowledge-graph-secrets
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8094
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8094
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-graph
  namespace: hotel-ai
spec:
  selector:
    app: knowledge-graph
  ports:
    - port: 8094
      targetPort: 8094
