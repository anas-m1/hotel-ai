apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-agent
  namespace: hotel-ai
  labels:
    app: multi-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multi-agent
  template:
    metadata:
      labels:
        app: multi-agent
    spec:
      tolerations:
        - key: workload
          value: ai
          effect: NoSchedule
      nodeSelector:
        role: ai
      containers:
        - name: multi-agent
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/hotel-ai-ENV/multi-agent:IMAGE_TAG
          ports:
            - containerPort: 8093
          envFrom:
            - secretRef:
                name: multi-agent-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8093
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8093
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: multi-agent
  namespace: hotel-ai
spec:
  selector:
    app: multi-agent
  ports:
    - port: 8093
      targetPort: 8093
