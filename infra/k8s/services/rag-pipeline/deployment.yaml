apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline
  namespace: hotel-ai
  labels:
    app: rag-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-pipeline
  template:
    metadata:
      labels:
        app: rag-pipeline
    spec:
      tolerations:
        - key: workload
          value: ai
          effect: NoSchedule
      nodeSelector:
        role: ai
      containers:
        - name: rag-pipeline
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/hotel-ai-ENV/rag-pipeline:IMAGE_TAG
          ports:
            - containerPort: 8091
          envFrom:
            - secretRef:
                name: rag-pipeline-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rag-pipeline
  namespace: hotel-ai
spec:
  selector:
    app: rag-pipeline
  ports:
    - port: 8091
      targetPort: 8091
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-pipeline
  namespace: hotel-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-pipeline
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
