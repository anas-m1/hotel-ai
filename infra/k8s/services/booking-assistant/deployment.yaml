apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-assistant
  namespace: hotel-ai
  labels:
    app: booking-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-assistant
  template:
    metadata:
      labels:
        app: booking-assistant
    spec:
      tolerations:
        - key: workload
          value: ai
          effect: NoSchedule
      nodeSelector:
        role: ai
      containers:
        - name: booking-assistant
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/hotel-ai-ENV/booking-assistant:IMAGE_TAG
          ports:
            - containerPort: 8092
          envFrom:
            - secretRef:
                name: booking-assistant-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: booking-assistant
  namespace: hotel-ai
spec:
  selector:
    app: booking-assistant
  ports:
    - port: 8092
      targetPort: 8092
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-assistant
  namespace: hotel-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-assistant
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
