version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/"
    schema:  "db/migrations/"
    gen:
      go:
        package:                      "db"
        out:                          "internal/repository/db"
        emit_json_tags:               true
        emit_interface:               true
        emit_empty_slices:            true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type:   "UUID"
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type: "string"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.bpchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "jsonb"
            nullable: false
            go_type:
              import: "encoding/json"
              type:   "RawMessage"
