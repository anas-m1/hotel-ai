name: CI

on:
  pull_request:
    branches: [main, "phase/*"]
  push:
    branches: [main]

jobs:
  # ── Go services ─────────────────────────────────────────────────────────────
  go-test:
    name: Go — test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # ── Python services ──────────────────────────────────────────────────────────
  python-lint:
    name: Python — ruff + mypy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ai/llm-gateway
          - ai/rag-pipeline
          - ai/booking-assistant
          - ai/multi-agent
          - ai/knowledge-graph
          - mcp/hotel-inventory
          - mcp/booking-ops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --dev

      - name: Ruff lint
        working-directory: ${{ matrix.service }}
        run: uv run ruff check src/

      - name: Ruff format check
        working-directory: ${{ matrix.service }}
        run: uv run ruff format --check src/

  # ── Docker build check ───────────────────────────────────────────────────────
  docker-build:
    name: Docker — build (no push)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: services/hotel-inventory
            name: hotel-inventory
          - service: services/booking-ops
            name: booking-ops
          - service: ai/llm-gateway
            name: llm-gateway
          - service: ai/rag-pipeline
            name: rag-pipeline
          - service: ai/booking-assistant
            name: booking-assistant
          - service: ai/multi-agent
            name: multi-agent
          - service: ai/knowledge-graph
            name: knowledge-graph
          - service: mcp/hotel-inventory
            name: mcp-hotel-inventory
          - service: mcp/booking-ops
            name: mcp-booking-ops
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
