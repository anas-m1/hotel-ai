name: CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: hotel-ai-prod
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

permissions:
  id-token: write   # OIDC token for AWS auth — no long-lived credentials
  contents: read

jobs:
  # ── Build & push all images ──────────────────────────────────────────────────
  build-and-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: services/hotel-inventory
            image: hotel-ai-prod/hotel-inventory
          - context: services/booking-ops
            image: hotel-ai-prod/booking-ops
          - context: ai/llm-gateway
            image: hotel-ai-prod/llm-gateway
          - context: ai/rag-pipeline
            image: hotel-ai-prod/rag-pipeline
          - context: ai/booking-assistant
            image: hotel-ai-prod/booking-assistant
          - context: ai/multi-agent
            image: hotel-ai-prod/multi-agent
          - context: ai/knowledge-graph
            image: hotel-ai-prod/knowledge-graph
          - context: mcp/hotel-inventory
            image: hotel-ai-prod/mcp-hotel-inventory
          - context: mcp/booking-ops
            image: hotel-ai-prod/mcp-booking-ops

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to EKS ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Apply namespace + base config
        run: kubectl apply -f infra/k8s/base/

      - name: Deploy services
        run: |
          IMAGE_TAG=${{ github.sha }}
          REGISTRY=${{ env.ECR_REGISTRY }}
          ENV=prod

          for svc in hotel-inventory booking-ops llm-gateway rag-pipeline booking-assistant multi-agent knowledge-graph; do
            sed \
              -e "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com|$REGISTRY|g" \
              -e "s|hotel-ai-ENV|hotel-ai-${ENV}|g" \
              -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
              infra/k8s/services/${svc}/deployment.yaml \
            | kubectl apply -f -
          done

      - name: Wait for rollout
        run: |
          for svc in hotel-inventory booking-ops llm-gateway rag-pipeline booking-assistant multi-agent knowledge-graph; do
            kubectl rollout status deployment/${svc} -n hotel-ai --timeout=300s
          done

      - name: Apply ingress
        run: kubectl apply -f infra/k8s/base/ingress.yaml
